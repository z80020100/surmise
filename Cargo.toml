[package]
name = "surmise"
version = "0.1.0"
edition = "2024"
# The pinned toolchain, which is the only one CI builds. Edition 2024 needs
# 1.85 at the least. This can drop once a job proves the lower bound.
rust-version = "1.98.0"
description = "TBD"
license = "MIT OR Apache-2.0"
repository = "https://github.com/z80020100/surmise"
# Nothing here is ready to ship. Before removing this, add an `exclude` list,
# because `cargo package` collects every file git does not ignore.
publish = false

[dependencies]
# The terminal's modes, its key events and its size. `events` carries the
# reader and `bracketed-paste` carries the paste event. The default set adds
# `derive-more` on top for `is_variant` derives that nothing here calls.
crossterm = { version = "0.29", default-features = false, features = [
  "bracketed-paste",
  "events",
  "windows",
] }
# The terminal device. Resolving one by name and polling it are libc calls with
# no equivalent in std.
libc = "0.2"
# Display width. A line can hold a character that is wider than one cell.
unicode-width = "0.2"

[dev-dependencies]
cargo-husky = { version = "1.5.0", default-features = false, features = ["user-hooks"] }
