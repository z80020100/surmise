[package]
name = "surmise"
version = "0.1.0"
edition = "2024"
# The lowest toolchain this crate compiles on. The `msrv` CI job proves it and
# reads the version out of this line, so this is the one place it is written.
# Edition 2024 sets the floor at 1.85 and two things here sit above it. A `let`
# chain needs 1.88 and `floor_char_boundary` needs 1.91.
rust-version = "1.91.0"
description = "Completion for cd directories and Git subcommands"
license = "MIT OR Apache-2.0"
repository = "https://github.com/z80020100/surmise"
# Nothing here is ready to ship. Before removing this, add an `exclude` list,
# because `cargo package` collects every file git does not ignore.
publish = false

[dependencies]
# The terminal's modes, its key events and its size. `events` carries the
# reader and `bracketed-paste` carries the paste event. The default set adds
# `derive-more` on top for `is_variant` derives that nothing here calls.
crossterm = { version = "0.29", default-features = false, features = [
  "bracketed-paste",
  "events",
  "windows",
] }
# Decompressing one spec out of the blob `build.rs` embeds. The `rust_backend`
# feature is what keeps this pure Rust, matching the converter's own choice of
# `boa_engine` over a C-backed alternative.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
# The terminal device. Resolving one by name and polling it are libc calls with
# no equivalent in std.
libc = "0.2"
# Directory history. Bundling SQLite keeps the database version independent
# of the one the operating system ships.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
# Display width. A line can hold a character that is wider than one cell.
unicode-width = "0.2"

[dev-dependencies]
cargo-husky = { version = "1.5.0", default-features = false, features = ["user-hooks"] }
# The pty the integration tests run surmise inside. The child needs the slave
# end as its controlling terminal, because crossterm resolves `/dev/tty` for
# raw mode rather than reading stdin. A child spawned any other way would put
# the terminal the tests were started from into raw mode.
portable-pty = "0.9"
# Checking that a spec the store hands back is valid JSON. `spec_store` deals
# in bytes and the phase that parses a spec is a later one, so this is a test
# dependency until then.
serde_json = "1.0.151"
# The screen those tests read. A byte stream can carry a box-drawing character
# and still render as garbage. Every assertion therefore reads a rendered
# screen rather than the stream.
vt100 = "0.16"

[build-dependencies]
# Compressing every spec into the blob. Same crate and same feature as the
# `[dependencies]` entry above, so the format a build writes is the one the
# binary reads back.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
# Reading `specs/index.json` for the command list `build.rs` embeds.
serde_json = "1.0.151"

# A build script compiles at opt-level 0 by default, and `miniz_oxide` is the
# `rust_backend` behind `flate2`, which is very slow unoptimized. This raises
# only the build script and its own dependencies, `build.rs` itself included,
# not the crate it builds.
[profile.dev.build-override]
opt-level = 2
[profile.release.build-override]
opt-level = 2
