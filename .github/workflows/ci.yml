name: CI

# No path filter. One that skips a run is a filter somebody has to keep in step
# with the tree. A skipped run never reports either and a required check would
# wait on it forever. The gate takes seconds. Running it always is cheaper.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# The workflow only ever reads the repository.
permissions:
  contents: read

# A later push to the same ref makes an earlier run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS is where this is developed and Linux is what says the code is not
  # quietly tied to it. A failure on one does not cancel the other, because
  # which platform failed is the answer a matrix exists to give.
  #
  # Each entry carries a platform name as well as a runner label. The label is
  # what the job runs on and the name is what the job is called. A label in the
  # name would put `macos-latest` in front of every reader and would move the
  # status check's own name whenever the label moved.
  #
  # The labels float while the toolchain is pinned. That is deliberate. A pinned
  # label goes stale and gets dropped. The platform is what CI is meant to
  # track.
  check:
    name: Check on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      # The toolchain goes in first. The cache action reads it to build its key
      # and a cache step in front of it would key on whatever the runner
      # shipped. rust-toolchain.toml names the toolchain and rustup installs it
      # from there.
      - name: Cache the toolchain
        uses: actions/cache@v4
        with:
          path: ~/.rustup/toolchains
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install the toolchain
        # `rustup show` performs the install but reports success even when the
        # install fails. Ask for the versions afterwards and let that fail the
        # step instead of a later one.
        run: |
          rustup show
          rustc --version
          cargo --version
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      # These go in ahead of the tests rather than ahead of `make shell`. The
      # pty tests run the widget in a real zsh and a Linux runner has to install
      # one. macOS ships zsh and needs the other two alone. Each platform gets
      # its own step so the interface says which install ran.
      - name: Install the shell tools
        if: runner.os == 'macOS'
        run: brew install shellcheck shfmt
      - name: Install the shell tools and zsh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt zsh
      # Every step below calls the Makefile so the commands have one definition
      # and each one still gets its own result in the GitHub interface.
      - name: Check formatting
        run: make fmt-check
      - name: Run clippy
        run: make clippy
      - name: Run tests
        run: make test
      - name: Check the shell scripts
        run: make shell
      - name: Build release
        run: make release
