name: CI

# No path filter. One that skips a run is a filter somebody has to keep in step
# with the tree. A skipped run never reports either and a required check would
# wait on it forever. The gate takes seconds. Running it always is cheaper.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# The workflow only ever reads the repository.
permissions:
  contents: read

# A later push to the same ref makes an earlier run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS only, by choice. No other platform is built and no other platform is
  # checked. The runner label floats while the toolchain is pinned. That is
  # deliberate. A pinned label goes stale and gets dropped. The platform is what
  # CI is meant to track.
  check:
    name: Check on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      # The toolchain goes in first. The cache action reads it to build its key
      # and a cache step in front of it would key on whatever the runner
      # shipped. rust-toolchain.toml names the toolchain and rustup installs it
      # from there.
      - name: Cache the toolchain
        uses: actions/cache@v4
        with:
          path: ~/.rustup/toolchains
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install the toolchain
        # `rustup show` performs the install but reports success even when the
        # install fails. Ask for the versions afterwards and let that fail the
        # step instead of a later one.
        run: |
          rustup show
          rustc --version
          cargo --version
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      # Every step below calls the Makefile so the commands have one definition
      # and each one still gets its own result in the GitHub interface.
      - name: Check formatting
        run: make fmt-check
      - name: Run clippy
        run: make clippy
      - name: Run tests
        run: make test
      # Neither tool is on the runner. zsh ships with macOS and needs no step.
      - name: Install the shell tools
        run: brew install shellcheck shfmt
      - name: Check the shell scripts
        run: make shell
      - name: Build release
        run: make release
