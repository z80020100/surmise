name: CI

on:
  push:
    branches:
      - main
    paths:
      - "**.rs"
      - "**.toml"
      - "**.sh"
      - "Makefile"
      - ".cargo-husky/**"
  pull_request:
    branches:
      - main
    paths:
      - "**.rs"
      - "**.toml"
      - "**.sh"
      - "Makefile"
      - ".cargo-husky/**"

jobs:
  # macOS only, by choice. No other platform is built, so no other platform is
  # checked.
  test:
    name: Test on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The toolchain goes in first. The cache action reads it to build its key,
      # so a cache step in front of it keys on whatever the runner shipped.
      # rust-toolchain.toml names the toolchain. rustup installs it from there.
      - name: Show the toolchain
        run: rustup show
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run cargo clippy
        run: cargo clippy --all-targets
      - name: Run cargo test
        run: cargo test
      - name: Run cargo build --release
        run: cargo build --release
