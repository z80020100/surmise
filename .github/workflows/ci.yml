name: CI

# No path filter. One that skips a run is a filter somebody has to keep in step
# with the tree. A skipped run never reports either and a required check would
# wait on it forever. The gate takes seconds. Running it always is cheaper.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# The workflow only ever reads the repository.
permissions:
  contents: read

# A later push to the same ref makes an earlier run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS is where this is developed and Linux is what says the code is not
  # quietly tied to it. A failure on one does not cancel the other, because
  # which platform failed is the answer a matrix exists to give.
  #
  # Each entry carries a platform name as well as a runner label. The label is
  # what the job runs on and the name is what the job is called. A label in the
  # name would put `macos-latest` in front of every reader and would move the
  # status check's own name whenever the label moved.
  #
  # The labels float while the toolchain is pinned. That is deliberate. A pinned
  # label goes stale and gets dropped. The platform is what CI is meant to
  # track.
  check:
    name: Check on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      # The toolchain goes in first. The cache action reads it to build its key
      # and a cache step in front of it would key on whatever the runner
      # shipped. rust-toolchain.toml names the toolchain and rustup installs it
      # from there.
      - name: Cache the toolchain
        uses: actions/cache@v4
        with:
          path: ~/.rustup/toolchains
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install the toolchain
        # `rustup show` performs the install but reports success even when the
        # install fails. Ask for the versions afterwards and let that fail the
        # step instead of a later one.
        run: |
          rustup show
          rustc --version
          cargo --version
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      # These go in ahead of the tests rather than ahead of `make shell`. The
      # pty tests run the widget in a real zsh and a Linux runner has to install
      # one. macOS ships zsh and needs the other two alone. Each platform gets
      # its own step so the interface says which install ran.
      - name: Install the shell tools
        if: runner.os == 'macOS'
        run: brew install shellcheck shfmt
      - name: Install the shell tools and zsh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt zsh
      # Every step below calls the Makefile so the commands have one definition
      # and each one still gets its own result in the GitHub interface.
      - name: Check formatting
        run: make fmt-check
      - name: Run clippy
        run: make clippy
      - name: Run tests
        run: make test
      - name: Check the shell scripts
        run: make shell
      - name: Build release
        run: make release

  # `rust-version` in Cargo.toml is a claim about a toolchain the job above does
  # not build. This is what makes it a checked claim rather than a number
  # somebody wrote down. The version is read out of Cargo.toml so that
  # declaration stays the one place it is written.
  msrv:
    name: Check the declared minimum
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      # The shape is checked as well as the presence. A declaration this step
      # cannot read is a gate that would otherwise install whatever it found.
      # Cargo takes `1.91` as readily as `1.91.0` so this counts the characters
      # rather than the components. Keeping a substituted value from ending the
      # command it belongs to is the next step's job rather than this one's.
      - name: Read the declared minimum
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          case "$version" in
          ''|*[!0-9.]*)
            echo "rust-version is not a version: $version" >&2
            exit 1
            ;;
          esac
          echo "version=$version" >>"$GITHUB_OUTPUT"
      # The version reaches every step below through the environment rather than
      # through the script text. A value substituted into the script is a value
      # that can end the command it was meant to be an argument to. A pull
      # request carries a Cargo.toml of its own.
      - name: Install the toolchain
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: |
          rustup toolchain install "$MSRV" --profile minimal
          rustc "+$MSRV" --version
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
      # `cargo check` is the whole of the claim. Neither clippy nor the tests
      # belong here. A lint set moves between releases and answering a new lint
      # is the pinned toolchain's job.
      - name: Check
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+$MSRV" check --locked --all-targets
