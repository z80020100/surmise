name: CI

# No path filter. One that skips a run is a filter somebody has to keep in step
# with the tree. A skipped run never reports either and a required check would
# wait on it forever. The gate takes seconds. Running it always is cheaper.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# The workflow only ever reads the repository.
permissions:
  contents: read

# A later push to the same ref makes an earlier run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS only, by choice. No other platform is built, so no other platform is
  # checked.
  test:
    name: Test on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The toolchain goes in first. The cache action reads it to build its key,
      # so a cache step in front of it keys on whatever the runner shipped.
      # rust-toolchain.toml names the toolchain. rustup installs it from there.
      - name: Show the toolchain
        run: rustup show
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      # Every step below calls the Makefile so the commands have one definition
      # and each one still gets its own result in the GitHub interface.
      - name: Check formatting
        run: make fmt-check
      - name: Run clippy
        run: make clippy
      - name: Run tests
        run: make test
      - name: Build release
        run: make release
